<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fbfbfa; }
      .site-title {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #212529;
      }
      .title {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 52px;
        font-weight: 600;
        fill: #212529;
        letter-spacing: -0.5px;
      }
      .desc {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 26px;
        font-weight: 400;
        fill: #6c757d;
      }
      .colophon {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #6c757d;
      }
    </style>
  </defs>

  <rect width="1200" height="630" class="bg" />

  <text x="100" y="85" class="site-title">{{ site_name }}</text>

  <text class="title">
    {{ title_tspans }}
  </text>

  {{ description_block }}

  <text x="100" y="565" class="colophon">
    {{ author }}
  </text>
</svg>
