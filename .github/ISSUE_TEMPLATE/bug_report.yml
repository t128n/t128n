name: "🐛 Bug report"
description: Something broken on the site
type: bug
labels: ["pending triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue so I can fix it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong? What did you expect to happen?
      placeholder: Bug description
    validations:
      required: true
  - type: textarea
    id: url
    attributes:
      label: Where
      description: Which page or URL?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — browser, device, screenshot, etc.
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: |
        If applicable, paste any console errors or network logs.
      render: shell-script
